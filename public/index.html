<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#635bff;
  --primary2:#8b7cff;
  --bg:#f5f6fa;
  --card:#ffffff;
  --text:#171923;
  --muted:#7c8191;
  --border:#e8eaf1;
  --dark:#171a2b;
  --dark2:#22263c;
  --green:#16b979;
  --red:#ef5364;
  --yellow:#f5ad24;
  --blue:#3b82f6;
  --shadow:0 12px 35px rgba(31,35,60,.07);
}

body.dark{
  --bg:#10131f;
  --card:#181c2b;
  --text:#f5f7ff;
  --muted:#9ba2b8;
  --border:#2a3043;
  --shadow:0 12px 35px rgba(0,0,0,.25);
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 10% 20%,#b9b0ff,transparent 30%),
    radial-gradient(circle at 90% 80%,#ffc8df,transparent 30%),
    linear-gradient(135deg,#5b52ec,#907dff);
}

.auth-box{
  width:100%;
  max-width:950px;
  min-height:580px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:white;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 30px 90px #0004;
}

.auth-left{
  padding:50px;
  color:white;
  background:linear-gradient(145deg,#5e55ed,#917dff);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.auth-left h1{
  font-size:43px;
  margin-bottom:15px;
}

.auth-left h1 span{
  color:#ffe66d;
}

.auth-left p{
  line-height:1.7;
  opacity:.9;
}

.auth-icon{
  font-size:130px;
  text-align:center;
  margin:30px 0;
}

.auth-right{
  padding:45px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.auth-logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:5px;
}

.auth-logo span{
  color:var(--primary);
}

.auth-subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f0f1f5;
  padding:5px;
  border-radius:12px;
  margin-bottom:20px;
}

.auth-tabs button{
  border:0;
  background:transparent;
  padding:12px;
  border-radius:9px;
  font-weight:800;
}

.auth-tabs button.active{
  background:white;
  box-shadow:0 4px 15px #0001;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #dfe2eb;
  border-radius:11px;
  padding:13px;
  outline:none;
  background:white;
  color:#171923;
}

.auth-btn{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#635bff,#8b7cff);
  color:white;
  padding:14px;
  border-radius:12px;
  font-weight:900;
}

#authMsg{
  text-align:center;
  margin-top:12px;
  min-height:20px;
  font-size:13px;
}

/* APP */

#app{
  display:none;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:var(--dark);
  color:white;
  padding:25px 17px;
  z-index:100;
  overflow-y:auto;
}

.logo{
  font-size:25px;
  font-weight:950;
  padding-left:10px;
  margin-bottom:35px;
}

.logo span{
  color:#8b7cff;
}

.menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb4c8;
  padding:12px;
  border-radius:11px;
  margin-bottom:5px;
  text-align:left;
  font-weight:800;
  transition:.2s;
}

.menu button:hover,
.menu button.active{
  background:#292e48;
  color:white;
}

.logout{
  margin-top:30px;
}

.logout button{
  width:100%;
  border:0;
  background:#292e48;
  color:white;
  padding:12px;
  border-radius:11px;
  font-weight:800;
}

.main{
  margin-left:245px;
  padding:30px;
  max-width:1650px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.welcome h1{
  font-size:32px;
  margin-bottom:5px;
}

.welcome p{
  color:var(--muted);
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  padding:8px 13px;
  border-radius:13px;
  box-shadow:var(--shadow);
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e8e5ff;
  display:grid;
  place-items:center;
}

/* HERO */

.hero{
  background:
    radial-gradient(circle at 90% 15%,#ffffff30,transparent 30%),
    linear-gradient(135deg,#635bff,#8c78ff);
  color:white;
  padding:28px;
  border-radius:22px;
  margin-bottom:20px;
  box-shadow:0 15px 40px #635bff30;
}

.hero h2{
  margin-bottom:8px;
}

.hero p{
  opacity:.9;
  margin-bottom:18px;
}

.progress{
  height:10px;
  background:#ffffff30;
  border-radius:20px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:white;
  transition:.4s;
}

.xp{
  margin-top:8px;
  font-size:13px;
}

/* CONTENT */

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:21px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.card-title h2{
  font-size:19px;
}

.primary{
  border:0;
  background:var(--primary);
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:800;
}

.secondary{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 15px;
  border-radius:10px;
  font-weight:800;
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* TASKS */

.task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.check{
  width:27px;
  height:27px;
  border:2px solid #d7dbe5;
  border-radius:8px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  background:transparent;
}

.task.done .check{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.task.done .task-name{
  text-decoration:line-through;
  color:var(--muted);
}

.task-name{
  font-weight:800;
}

.task-xp{
  margin-left:auto;
  font-size:11px;
  background:#efeeff;
  color:#635bff;
  padding:6px 9px;
  border-radius:20px;
}

.delete{
  border:0;
  background:transparent;
  padding:5px;
}
/* =========================
STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
}

.stat strong{
  display:block;
  font-size:25px;
  margin:8px 0;
}

.stat small{
  color:var(--muted);
}

/* =========================
COACH CARD
========================= */

.coach{
  background:linear-gradient(135deg,#f0efff,#faf9ff);
}

body.dark .coach{
  background:#20253a;
}

.coach-icon{
  font-size:30px;
  margin-bottom:10px;
}

.coach-message{
  color:var(--muted);
  line-height:1.7;
}

/* =========================
AI SOLVE
========================= */

#page-ai-solve .card{
  max-width:900px;
}

#page-ai-solve textarea{
  resize:vertical;
  min-height:120px;
}

#aiResult{
  white-space:pre-wrap;
  word-break:break-word;
}

/* =========================
SUBJECTS
========================= */

.subject-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:15px;
}

.subject{
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  background:var(--card);
  transition:.2s;
}

.subject:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.subject-icon{
  font-size:34px;
  margin-bottom:10px;
}

.subject h3{
  margin-bottom:5px;
}

.subject p{
  color:var(--muted);
  font-size:12px;
}

.subject button{
  margin-top:12px;
  width:100%;
}

/* =========================
EXAMS
========================= */

.exam{
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.exam-date{
  color:var(--primary);
  font-weight:900;
}

.exam-actions{
  display:flex;
  gap:6px;
}

/* =========================
NOTES
========================= */

.notes-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:15px;
}

.note{
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  background:var(--card);
}

.note h3{
  margin-bottom:8px;
}

.note p{
  color:var(--muted);
  line-height:1.6;
  white-space:pre-wrap;
}

.note-footer{
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
}

/* =========================
FOCUS
========================= */

.focus-box{
  text-align:center;
}

.timer{
  font-size:80px;
  font-weight:950;
  margin:30px 0;
}

.focus-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

/* =========================
BADGES
========================= */

.badges{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;
}

.badge{
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  text-align:center;
}

.badge-icon{
  font-size:40px;
  margin-bottom:8px;
}

.badge small{
  color:var(--muted);
}

.badge.locked{
  opacity:.35;
  filter:grayscale(1);
}

/* =========================
PROFILE
========================= */
.profile-card{
  max-width:700px;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#e9e6ff;
  display:grid;
  place-items:center;
  font-size:45px;
  margin-bottom:15px;
}

.profile-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.profile-item{
  background:var(--bg);
  padding:15px;
  border-radius:12px;
}

.profile-item span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

/* =========================
DERS KOÇU
========================= */

.coach-page{
  max-width:950px;
}

.coach-header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.coach-avatar{
  width:55px;
  height:55px;
  border-radius:16px;
  background:linear-gradient(
    135deg,
    #635bff,
    #9b8cff
  );
  color:white;
  display:grid;
  place-items:center;
  font-size:28px;
}

.coach-title h2{
  margin-bottom:4px;
}

.coach-title p{
  color:var(--muted);
  font-size:13px;
}

/* CHAT */

.chat-box{
  height:500px;
  overflow-y:auto;
  padding:20px;
  background:var(--bg);
  border-radius:18px;
  border:1px solid var(--border);
  margin-bottom:15px;
  scroll-behavior:smooth;
}

.chat-empty{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.chat-message{
  display:flex;
  margin-bottom:16px;
}

.chat-message.user{
  justify-content:flex-end;
}

.chat-message.ai{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:13px 16px;
  border-radius:17px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}

.chat-message.user .message-bubble{
  background:var(--primary);
  color:white;
  border-bottom-right-radius:5px;
}

.chat-message.ai .message-bubble{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.message-label{
  font-size:10px;
  color:var(--muted);
  margin-bottom:4px;
  font-weight:700;
}

.chat-message.user .message-label{
  text-align:right;
}

.typing{
  display:inline-flex;
  gap:4px;
  align-items:center;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.5;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

.chat-options{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.chat-option{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.chat-option:hover{
  border-color:var(--primary);
  color:var(--primary);
}

.chat-input-area{
  display:flex;
  gap:10px;
  align-items:flex-end;
}

#coachInput{
  flex:1;
  min-height:52px;
  max-height:150px;
  resize:none;
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  outline:none;
  background:var(--card);
  color:var(--text);
}

#coachInput:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.12);
}

.send-button{
  width:54px;
  height:52px;
  border:0;
  border-radius:15px;
  background:var(--primary);
  color:white;
  font-size:21px;
  flex-shrink:0;
}

.send-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.coach-tools{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.coach-tools small{
  color:var(--muted);
}

.new-chat{
  border:0;
  background:transparent;
  color:var(--primary);
  font-weight:800;
}

/* =========================
LEGAL / INFORMATION PAGES
========================= */

.legal-page{
  max-width:950px;
}

.legal-page h2{
  margin-bottom:20px;
}

.legal-page h3{
  margin-top:25px;
  margin-bottom:9px;
  font-size:17px;
}

.legal-page p{
  color:var(--muted);
  line-height:1.8;
  margin-bottom:12px;
}

.legal-page ul{
  margin:10px 0 15px 22px;
  color:var(--muted);
  line-height:1.9;
}

.info-highlight{
  padding:16px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:14px;
  margin:15px 0;
}

.contact-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.contact-item{
  background:var(--bg);
  padding:18px;
  border-radius:15px;
  border:1px solid var(--border);
}

.contact-item strong{
  display:block;
  margin-bottom:7px;
}

.contact-item span{
  color:var(--muted);
  line-height:1.6;
}
/* =========================
FOOTER
========================= */

.site-footer{
  margin-top:40px;
  padding:25px 10px 10px;
  border-top:1px solid var(--border);
  color:var(--muted);
  text-align:center;
}

.footer-links{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px 18px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.footer-links button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  padding:5px;
}

.footer-links button:hover{
  color:var(--primary);
}

.footer-copy{
  font-size:12px;
}

/* =========================
MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  background:var(--card);
  color:var(--text);
  border-radius:22px;
  padding:23px;
  max-height:90vh;
  overflow:auto;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:transparent;
  font-size:24px;
  color:var(--text);
}

/* =========================
TOAST
========================= */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:20000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  background:var(--dark);
  color:white;
  padding:13px 17px;
  border-radius:13px;
  box-shadow:0 15px 35px #0004;
  animation:toast .3s;
}

@keyframes toast{
  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
MOBILE
========================= */

.mobile-btn{
  display:none;
  position:fixed;
  right:15px;
  top:15px;
  z-index:500;
  width:46px;
  height:46px;
  border:0;
  border-radius:13px;
  background:var(--dark);
  color:white;
  font-size:22px;
}

.mobile-menu{
  position:fixed;
  top:0;
  right:-290px;
  width:280px;
  height:100vh;
  background:var(--dark);
  color:white;
  z-index:1000;
  padding:25px 18px;
  transition:.25s;
  overflow-y:auto;
  box-shadow:-15px 0 40px rgba(0,0,0,.2);
}

.mobile-menu.open{
  right:0;
}

.mobile-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#adb4c8;
  padding:13px;
  border-radius:10px;
  text-align:left;
  margin-bottom:5px;
  font-weight:800;
}

.mobile-menu button:hover{
  background:#292e48;
  color:white;
}

.mobile-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.mobile-head button{
  width:auto;
  color:white;
  font-size:22px;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:1000px){

  .sidebar{
    width:80px;
  }

  .logo{
    font-size:0;
    text-align:center;
    padding:0;
  }

  .logo:after{
    content:"DT";
    font-size:22px;
  }

  .menu button{
    font-size:0;
    text-align:center;
  }

  .menu button::first-letter{
    font-size:20px;
  }

  .logout button{
    font-size:0;
  }

  .logout button:after{
    content:"🚪";
    font-size:20px;
  }

  .main{
    margin-left:80px;
  }

  .grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .mobile-btn{
    display:block;
  }

  .main{
    margin-left:0;
    padding:15px;
  }

  .topbar{
    padding-right:60px;
  }

  .profile{
    display:none;
  }

  .welcome h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .auth-box{
    grid-template-columns:1fr;
  }

  .auth-left{
    display:none;
  }

  .auth-right{
    padding:30px 22px;
  }

  .subject-grid{
    grid-template-columns:1fr 1fr;
  }

  .profile-info{
    grid-template-columns:1fr;
  }

  .exam{
    flex-direction:column;
    align-items:flex-start;
  }

  .timer{
    font-size:58px;
  }

  .chat-box{
    height:55vh;
    padding:12px;
  }

  .message-bubble{
    max-width:88%;
  }

  .chat-input-area{
    align-items:stretch;
  }

  #coachInput{
    min-height:50px;
  }

  .coach-tools{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }

  .contact-box{
    grid-template-columns:1fr;
  }

  .footer-links{
    gap:5px 12px;
  }

  .legal-page{
    padding:5px;
  }
}

@media(max-width:400px){

  .subject-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:20px;
  }

  .card{
    padding:17px;
  }

  .auth-right{
    padding:25px 17px;
  }
}

/* =========================================================
   DERS TAKİP PRO — PREMIUM UI OVERRIDE
   Mevcut HTML / JS / ID / CLASS yapısını bozmaz.
   ========================================================= */

:root{
  --primary:#635bff;
  --primary2:#8b7cff;
  --primary3:#5146e5;

  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#171923;
  --muted:#7b8194;
  --border:#e8eaf2;

  --dark:#111425;
  --dark2:#1b1f34;

  --green:#16b979;
  --red:#ef5364;
  --yellow:#f5ad24;
  --blue:#3b82f6;

  --shadow-sm:0 4px 14px rgba(25,30,55,.05);
  --shadow:0 12px 35px rgba(25,30,55,.08);
  --shadow-lg:0 25px 70px rgba(25,30,55,.12);

  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
}

/* =========================================================
   GLOBAL
   ========================================================= */

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(99,91,255,.055),
      transparent 25%
    ),
    var(--bg);

  color:var(--text);
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease,
    color .18s ease,
    opacity .18s ease;
}

button:active{
  transform:scale(.97);
}

::selection{
  background:rgba(99,91,255,.2);
  color:var(--text);
}

/* =========================================================
   AUTH
   ========================================================= */

#auth{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(255,255,255,.20),
      transparent 25%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(255,215,235,.28),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #554ce6 0%,
      #6f64f5 45%,
      #9382ff 100%
    );
}

#auth::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  top:-220px;
  right:-180px;
}

#auth::after{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  bottom:-180px;
  left:-120px;
}

.auth-box{
  position:relative;
  z-index:2;

  max-width:1000px;
  min-height:610px;

  border-radius:28px;

  background:rgba(255,255,255,.97);

  box-shadow:
    0 40px 100px rgba(20,15,70,.28),
    0 8px 30px rgba(20,15,70,.10);

  border:1px solid rgba(255,255,255,.35);
}

.auth-left{
  position:relative;
  overflow:hidden;

  padding:58px;

  background:
    radial-gradient(
      circle at 80% 15%,
      rgba(255,255,255,.18),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      #5b52ed,
      #7c6df6 55%,
      #9b89ff
    );
}

.auth-left::after{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  right:-100px;
  bottom:-80px;
}

.auth-left h1{
  position:relative;
  z-index:2;

  font-size:46px;
  line-height:1.05;
  letter-spacing:-1.8px;
}

.auth-left p{
  max-width:410px;
  font-size:15px;
  line-height:1.8;
}

.auth-icon{
  position:relative;
  z-index:2;

  font-size:120px;

  filter:
    drop-shadow(0 20px 25px rgba(0,0,0,.15));

  animation:authFloat 4s ease-in-out infinite;
}

@keyframes authFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }
}

.auth-right{
  padding:55px 50px;
}

.auth-logo{
  font-size:34px;
  letter-spacing:-1.5px;
}

.auth-subtitle{
  color:#8a8fa0;
  font-size:14px;
}

.auth-tabs{
  background:#f4f5f9;
  border:1px solid #eceef4;
  border-radius:14px;
}

.auth-tabs button{
  color:#7b8090;
}

.auth-tabs button.active{
  color:#242638;
  background:#fff;
  box-shadow:
    0 5px 16px rgba(30,35,60,.08);
}

.field label{
  color:#42475a;
  font-size:12px;
  letter-spacing:.01em;
}

.field input,
.field textarea,
.field select{
  border:1px solid #e0e3ec;
  background:#fbfcfe;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.field input:hover,
.field textarea:hover,
.field select:hover{
  border-color:#cfd3df;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--primary);
  background:#fff;

  box-shadow:
    0 0 0 4px rgba(99,91,255,.10);
}
/* =========================================================
   AUTH BUTTON
   ========================================================= */

.auth-btn{
  box-shadow:0 10px 24px rgba(99,91,255,.25);
  transition:transform .18s ease,box-shadow .18s ease;
}

.auth-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 30px rgba(99,91,255,.32);
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
  width:260px;
  padding:24px 15px;
  background:linear-gradient(180deg,#121527 0%,#171b30 100%);
  border-right:1px solid rgba(255,255,255,.04);
  box-shadow:8px 0 35px rgba(15,18,35,.08);
}

.logo{
  padding:8px 13px;
  margin-bottom:30px;
  font-size:25px;
  letter-spacing:-1px;
}

.logo span{
  color:#9488ff;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.menu button{
  position:relative;
  padding:12px 13px;
  color:#969db5;
  border:1px solid transparent;
  transition:background .2s ease,color .2s ease,transform .2s ease;
}

.menu button:hover{
  background:rgba(255,255,255,.055);
  color:#fff;
  transform:translateX(2px);
}

.menu button.active{
  color:#fff;
  background:linear-gradient(90deg,rgba(99,91,255,.22),rgba(139,124,255,.10));
  border-color:rgba(139,124,255,.12);
}

.menu button.active::before{
  content:"";
  position:absolute;
  left:-15px;
  top:8px;
  bottom:8px;
  width:3px;
  border-radius:0 5px 5px 0;
  background:linear-gradient(180deg,#8f84ff,#635bff);
}

.logout{
  border-top:1px solid rgba(255,255,255,.06);
  padding-top:18px;
}

.logout button{
  background:rgba(255,255,255,.055);
  color:#b8bed0;
}

.logout button:hover{
  background:rgba(239,83,100,.12);
  color:#ff9aa5;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
  margin-left:260px;
  padding:34px;
  max-width:none;
}

.topbar{
  margin-bottom:28px;
}

.welcome h1{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1.2px;
}

.welcome p{
  font-size:14px;
}

.profile{
  padding:7px 12px 7px 8px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  transition:transform .2s ease,box-shadow .2s ease;
}

.profile:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.avatar{
  background:linear-gradient(135deg,#eeeaff,#e2ddff);
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
  position:relative;
  overflow:hidden;
  padding:30px;
  border-radius:24px;
  background:
    radial-gradient(circle at 90% 0%,rgba(255,255,255,.22),transparent 30%),
    radial-gradient(circle at 15% 100%,rgba(255,255,255,.10),transparent 25%),
    linear-gradient(135deg,#5d54ed,#7166f4 50%,#9380ff);
  box-shadow:0 20px 50px rgba(99,91,255,.22);
}

.hero::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
  right:-60px;
  bottom:-90px;
}

.hero h2{
  font-size:21px;
  letter-spacing:-.4px;
}

.hero p{
  font-size:14px;
}

.progress{
  height:9px;
  background:rgba(255,255,255,.20);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
}

.progress span{
  background:linear-gradient(90deg,#fff,#e8e5ff);
  box-shadow:0 0 12px rgba(255,255,255,.55);
}

/* =========================================================
   CARDS
   ========================================================= */

.card{
  position:relative;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}

.card:hover{
  box-shadow:0 16px 45px rgba(25,30,55,.09);
}

.card-title h2{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.4px;
}

.primary{
  background:linear-gradient(135deg,#635bff,#7d70f7);
  box-shadow:0 7px 18px rgba(99,91,255,.18);
}

.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 11px 25px rgba(99,91,255,.28);
}

.secondary{
  background:var(--card);
}

.secondary:hover{
  border-color:#bdb8ff;
  color:var(--primary);
  background:#faf9ff;
}

/* =========================================================
   COACH HOME
   ========================================================= */

.coach{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(99,91,255,.12),transparent 30%),
    linear-gradient(135deg,#f0efff,#faf9ff);
}

body.dark .coach{
  background:#20253a;
}

.coach-icon{
  font-size:30px;
  margin-bottom:10px;
}

.coach-message{
  color:var(--muted);
  line-height:1.7;
}
/* =========================================================
   TASKS
   ========================================================= */

.task{
  padding:14px 5px;
  transition:background .2s ease,padding .2s ease;
}

.task:hover{
  background:rgba(99,91,255,.025);
}

.check{
  border-color:#d1d5e0;
  transition:background .2s ease,border-color .2s ease,transform .2s ease;
}

.check:hover{
  border-color:var(--primary);
  transform:scale(1.05);
}

.task.done .check{
  box-shadow:0 5px 12px rgba(22,185,121,.20);
}

.task-xp{
  background:#f0eeff;
  color:#635bff;
  font-weight:900;
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
  gap:18px;
}

.stat{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--card),rgba(249,250,255,.8));
  transition:transform .2s ease,box-shadow .2s ease;
}

.stat:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
}

.stat strong{
  font-size:29px;
  letter-spacing:-1px;
}

/* =========================================================
   SUBJECTS
   ========================================================= */

.subject{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--card),#fafaff);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}

.subject:hover{
  transform:translateY(-5px);
  border-color:#d5d1ff;
  box-shadow:0 18px 35px rgba(40,40,80,.10);
}

.subject-icon{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#f0eeff,#e9e6ff);
  font-size:27px;
}

.subject h3{
  font-size:16px;
}

/* =========================================================
   EXAMS
   ========================================================= */

.exam{
  background:var(--card);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}

.exam:hover{
  transform:translateX(3px);
  border-color:#d7d2ff;
  box-shadow:var(--shadow-sm);
}

.exam-date{
  font-size:13px;
}

/* =========================================================
   NOTES
   ========================================================= */

.note{
  position:relative;
  background:linear-gradient(145deg,var(--card),#fbfbff);
  transition:transform .2s ease,box-shadow .2s ease;
}

.note:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}

.note h3{
  font-size:16px;
}

.note p{
  font-size:14px;
}

/* =========================================================
   FOCUS
   ========================================================= */

.focus-box{
  overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(99,91,255,.08),transparent 38%),var(--card);
}

.timer{
  font-variant-numeric:tabular-nums;
  font-size:86px;
  letter-spacing:-4px;
  background:linear-gradient(135deg,#635bff,#8b7cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

/* =========================================================
   BADGES
   ========================================================= */

.badge{
  background:linear-gradient(145deg,var(--card),#fafaff);
  transition:transform .2s ease,box-shadow .2s ease;
}

.badge:not(.locked):hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.badge-icon{
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.07));
}

/* =========================================================
   PROFILE
   ========================================================= */

.profile-avatar{
  background:linear-gradient(135deg,#eeeaff,#dfdaff);
  box-shadow:0 10px 25px rgba(99,91,255,.12);
}

.profile-item{
  border:1px solid var(--border);
  background:linear-gradient(145deg,var(--bg),rgba(255,255,255,.45));
}

/* =========================================================
   AI SOLVE
   ========================================================= */

#page-ai-solve .card{
  box-shadow:var(--shadow-lg);
}

#page-ai-solve textarea{
  min-height:150px;
}

#aiResult{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}

#aiSolveButton{
  min-height:52px;
}

/* =========================================================
   COACH CHAT
   ========================================================= */

.coach-page{
  box-shadow:var(--shadow-lg);
}

.coach-avatar{
  width:58px;
  height:58px;
  border-radius:17px;
  background:linear-gradient(135deg,#635bff,#8f82ff);
  box-shadow:0 10px 25px rgba(99,91,255,.22);
}

.chat-box{
  background:radial-gradient(circle at 100% 0%,rgba(99,91,255,.045),transparent 30%),var(--bg);
}

.chat-message.ai .message-bubble{
  box-shadow:0 6px 20px rgba(25,30,55,.045);
}

.chat-message.user .message-bubble{
  box-shadow:0 7px 18px rgba(99,91,255,.18);
}

.chat-option{
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}

.chat-option:hover{
  transform:translateY(-2px);
  background:#faf9ff;
}

.send-button{
  box-shadow:0 8px 20px rgba(99,91,255,.20);
}

.send-button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(99,91,255,.30);
}

/* =========================================================
   LEGAL
   ========================================================= */

.legal-page{
  box-shadow:var(--shadow);
}

.legal-page h2{
  font-size:23px;
  letter-spacing:-.6px;
}

.info-highlight{
  background:linear-gradient(135deg,rgba(99,91,255,.06),rgba(139,124,255,.025));
  border-color:rgba(99,91,255,.12);
}

/* =========================================================
   FOOTER
   ========================================================= */

.site-footer{
  margin-top:50px;
  padding-top:30px;
}

.footer-links button{
  transition:color .2s ease,transform .2s ease;
}

.footer-links button:hover{
  transform:translateY(-1px);
}

/* =========================================================
   MODAL
   ========================================================= */

.modal{
  background:rgba(10,12,25,.62);
  backdrop-filter:blur(10px);
}

.modal-box{
  border:1px solid var(--border);
  box-shadow:0 30px 90px rgba(0,0,0,.25);
  animation:modalIn .22s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.98);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.close{
  width:38px;
  height:38px;
  border-radius:10px;
  transition:background .2s ease,color .2s ease;
}

.close:hover{
  background:var(--bg);
  color:var(--red);
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,#171a2b,#22263c);
  box-shadow:0 15px 40px rgba(0,0,0,.20);
}

/* =========================================================
   MOBILE MENU
   ========================================================= */

.mobile-btn{
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.mobile-menu{
  background:linear-gradient(180deg,#121527,#171b30);
}

.mobile-menu button{
  transition:background .2s ease,color .2s ease;
}

.mobile-menu button:hover{
  background:rgba(255,255,255,.06);
}

/* =========================================================
   DARK MODE — PREMIUM
   ========================================================= */

body.dark{
  --bg:#0c0f1b;
  --card:#151927;
  --text:#f5f7ff;
  --muted:#9ba3b8;
  --border:#272d40;
  --shadow:0 15px 40px rgba(0,0,0,.22);
}

body.dark{
  background:radial-gradient(circle at 0% 0%,rgba(99,91,255,.07),transparent 25%),var(--bg);
}

body.dark .card{
  background:linear-gradient(145deg,#151927,#171b2c);
}

body.dark .stat,
body.dark .subject,
body.dark .note,
body.dark .exam{
  background:#151927;
}

body.dark .secondary{
  background:#151927;
}

body.dark .secondary:hover{
  background:#1c2032;
  border-color:#4d46a7;
}

body.dark .field input,
body.dark .field textarea,
body.dark .field select{
  background:#111522;
  color:#f5f7ff;
  border-color:#2a3043;
}

body.dark .field input:focus,
body.dark .field textarea:focus,
body.dark .field select:focus{
  background:#14182a;
}

body.dark .profile-item{
  background:#10131f;
}

body.dark .coach{
  background:radial-gradient(circle at 100% 0%,rgba(99,91,255,.14),transparent 30%),#181c2b;
}

body.dark .chat-option{
  background:#151927;
}

body.dark .chat-option:hover{
  background:#1d2233;
}

body.dark .auth-box{
  background:#171a28;
}

body.dark .auth-right{
  color:#f5f7ff;
}

body.dark .auth-subtitle{
  color:#9ba3b8;
}

body.dark .auth-tabs{
  background:#111522;
  border-color:#272d40;
}

body.dark .auth-tabs button{
  color:#9ba3b8;
}

/* ==========================================
   SINIF → DERS
========================================== */

function loadSubjects() {

    const grade =
        document.getElementById("gradeSelect").value;

    const select =
        document.getElementById("subjectSelect");

    select.innerHTML =
        '<option value="">Ders seç</option>';

    if (!subjects[grade]) return;

    subjects[grade].forEach(subject => {

        const option =
            document.createElement("option");

        option.value = subject;
        option.textContent = subject;

        select.appendChild(option);

    });

    document.getElementById("topicSelect").innerHTML =
        '<option value="">Önce ders seç</option>';

}


/* ==========================================
   DERS → KONU
========================================== */

function loadTopics() {

    const subject =
        document.getElementById("subjectSelect").value;

    const select =
        document.getElementById("topicSelect");

    select.innerHTML =
        '<option value="">Konu seç</option>';

    if (!topics[subject]) {

        select.innerHTML +=
            '<option value="">Tüm konular</option>';

        return;

    }

    topics[subject].forEach(topic => {

        const option =
            document.createElement("option");

        option.value = topic;
        option.textContent = topic;

        select.appendChild(option);

    });

}


/* ==========================================

========================================== */

function showTestTab(tab, button) {

    document.querySelectorAll(".test-tab")
        .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("testsTab").style.display =
        tab === "tests" ? "block" : "none";

    document.getElementById("notesTab").style.display =
        tab === "notes" ? "block" : "none";

}


/* ==========================================

========================================== */

function loadNotes() {

    const grade =
        document.getElementById("notesGrade").value;

    const container =
        document.getElementById("notesContent");

    if (!grade) {

        container.innerHTML = `
            <div style="text-align:center;padding:40px;color:#777">
                📚 Sınıfını seç.
            </div>`;

        return;

    }

    container.innerHTML = "";

    subjects[grade].forEach(subject => {

        const card =
            document.createElement("div");

        card.className = "subject-card";

        const icon =
            getSubjectIcon(subject);

        card.innerHTML = `

            <div class="subject-icon">
                ${icon}
            </div>

            <h3>${subject}</h3>

            <p>
                ${topics[subject]
                    ? topics[subject].length
                    : "Birçok"} konu
            </p>

            <div class="topic-list">

                ${
                    topics[subject]
                    ?
                    topics[subject].map(topic => `

                        <div class="topic">

                            <span>
                                📖 ${topic}
                            </span>

                            <button
                                onclick="openNote('${topic}')">
                                Aç
                            </button>

                        </div>

                    `).join("")
                    :
                    `
                    <div class="topic">
                        📚 Konular hazırlanıyor...
                    </div>
                    `
                }

            </div>
        `;

        card.onclick = function(e) {

            if (e.target.tagName === "BUTTON") return;

            const list =
                card.querySelector(".topic-list");

            list.classList.toggle("open");

        };

        container.appendChild(card);

    });

}

function searchNotes() {

    const search =
        document.getElementById("noteSearch")
            .value
            .toLowerCase();

    document.querySelectorAll(
        "#notesContent .subject-card"
    ).forEach(card => {

        const text =
            card.innerText.toLowerCase();

        card.style.display =
            text.includes(search)
                ? "block"
                : "none";

    });

}


/* ==========================================
   TEST BAŞLAT
========================================== */

let currentQuestion = 0;
let totalQuestions = 10;

function startTest() {

    const grade =
        document.getElementById("gradeSelect").value;

    const subject =
        document.getElementById("subjectSelect").value;

    const topic =
        document.getElementById("topicSelect").value;

    if (!grade || !subject) {

        alert("⚠️ Önce sınıf ve ders seçmelisin.");

        return;

    }

    totalQuestions = Number(
        document.getElementById("questionCount").value
    );

    currentQuestion = 0;

    document.getElementById("testsTab").style.display =
        "none";

    document.getElementById("testScreen").style.display =
        "block";

    showQuestion();

}


/* ==========================================
   SORU GÖSTER
========================================== */

function showQuestion() {

    currentQuestion++;

    document.getElementById("questionNumber")
        .textContent =
        `Soru ${currentQuestion} / ${totalQuestions}`;

    document.getElementById("questionText")
        .textContent =
        "Bu konuya ait soru burada gösterilecek.";

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    ["A", "B", "C", "D"].forEach(letter => {

        answers.innerHTML += `

            <label class="answer">

                <input
                    type="radio"
                    name="answer"
                    value="${letter}">

                ${letter}) Cevap seçeneği

            </label>

        `;

    });

}


/* ==========================================
   SONRAKİ SORU
========================================== */

function nextQuestion() {

    if (currentQuestion >= totalQuestions) {

        finishTest();

        return;

    }

    showQuestion();

}


/* ==========================================
   TEST BİTİR
========================================== */

function finishTest() {

    document.getElementById("testScreen")
        .innerHTML = `

        <div class="question-box result-box">

            <div style="font-size:60px">
                🎉
            </div>

            <h2>Test Tamamlandı!</h2>

            <div class="result-score">
                %100
            </div>

            <p>
                Testi tamamladın.
            </p>

            <p>
                ⭐ +50 XP kazandın!
            </p>

            <button
                class="start-test"
                onclick="location.reload()">

                🔄 Yeni Test Çöz

            </button>

        </div>

    `;

}

========================================== */

function quickTest(subject) {

    document.getElementById("gradeSelect").value = "8";

    loadSubjects();

    document.getElementById("subjectSelect").value =
        subject;

        top: 0,

    });

}

function renderExams() {

  if (!data.exams.length) {

    examList.innerHTML = `
      <p style="color:var(--muted);padding:20px 0">
        Henüz sınav eklemedin.
      </p>
    `;

    return;
  }

  const sorted = [...data.exams].sort(
    (a, b) => new Date(a.date) - new Date(b.date)
  );

  examList.innerHTML = sorted.map(e => {

    const days = Math.ceil(
      (new Date(e.date) - new Date()) / 86400000
    );

    let remaining;

    if (days < 0) {
      remaining = "Geçmiş";
    } else if (days === 0) {
      remaining = "Bugün";
    } else {
      remaining = days + " gün kaldı";
    }

    return `
      <div class="exam">

        <div>
          <strong>${escapeHTML(e.name)}</strong>

          <p style="color:var(--muted);margin-top:5px">
            ${escapeHTML(e.subject)}
            ${
              e.target
                ? " • Hedef: " + escapeHTML(e.target)
                : ""
            }
          </p>
        </div>

        <div style="text-align:right">

          <div class="exam-date">
            ${formatDate(e.date)}
          </div>

          <small style="color:var(--muted)">
            ${remaining}
          </small>

          <div class="exam-actions">
            <button
              class="delete"
              onclick="deleteExam(${e.id})">
              🗑️
            </button>
          </div>

        </div>

      </div>
    `;

  }).join("");

}

/* =====================================================
   ODAKLANMA ZAMANLAYICISI
===================================================== */

let timerSeconds = 25 * 60;
let timerInterval = null;

function updateTimer() {

  const min = Math.floor(timerSeconds / 60)
    .toString()
    .padStart(2, "0");

  const sec = (timerSeconds % 60)
    .toString()
    .padStart(2, "0");

  timer.textContent = `${min}:${sec}`;

}

function startTimer() {

  if (timerInterval) return;

  timerInterval = setInterval(() => {

    if (timerSeconds <= 0) {

      clearInterval(timerInterval);
      timerInterval = null;

      toast("Odaklanma süresi tamamlandı! 🎉");

      data.xp += 10;
      save();
      renderAll();

      return;
    }

    timerSeconds--;

    updateTimer();

  }, 1000);

}

function pauseTimer() {

  clearInterval(timerInterval);
  timerInterval = null;

}

function resetTimer() {

  pauseTimer();

  timerSeconds = 25 * 60;

  updateTimer();

}
<script>
/* =====================================================
   YAPAY ZEKA İLE SORU ÇÖZME
===================================================== */

let aiImageData = "";

function previewAIImage(event) {

  const file = event.target.files[0];

  if (!file) {
    aiImageData = "";
    aiImagePreview.style.display = "none";
    return;
  }

  if (!file.type.startsWith("image/")) {
    toast("Lütfen bir görsel seç.");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    aiImageData = e.target.result;
    aiPreview.src = aiImageData;
    aiImagePreview.style.display = "block";
  };

  reader.readAsDataURL(file);

}

async function solveAIQuestion() {

  const question = aiQuestion.value.trim();

  const subject =
    document.getElementById("aiSubject").value;

  const mode =
    document.getElementById("aiMode").value;

  if (!question && !aiImageData) {
    toast("Lütfen soru yaz veya fotoğraf yükle.");
    return;
  }

  aiResult.style.display = "none";
  aiLoading.style.display = "block";
  aiSolveButton.disabled = true;

  try {

    const response = await fetch("/api/solve", {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },

      body: JSON.stringify({
        image: aiImageData || null,
        question: question || null,
        subject,
        mode
      })
    });

    const raw = await response.text();

    let result;

    try {
      result = JSON.parse(raw);
    } catch {
      throw new Error(
        "Sunucu JSON yerine farklı bir yanıt döndürdü."
      );
    }

    if (!response.ok) {
      throw new Error(
        result?.error ||
        `Sunucu hatası (${response.status})`
      );
    }

    if (!result.success) {
      throw new Error(
        result.error || "Soru çözülemedi."
      );
    }

    aiResult.textContent =
      result.answer || "Yanıt alınamadı.";

    aiResult.style.display = "block";

    toast("Soru başarıyla çözüldü 🧠");

  } catch (error) {

    console.error(error);

    aiResult.textContent =
      "❌ Hata oluştu.\n\n" + error.message;

    aiResult.style.display = "block";

  } finally {

    aiLoading.style.display = "none";
    aiSolveButton.disabled = false;

  }

}


/* =====================================================
   YARDIMCI FONKSİYONLAR
===================================================== */

function formatDate(date) {

  if (!date) return "-";

  return new Date(date).toLocaleDateString(
    "tr-TR",
    {
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );

}

function formatDateTime(date) {

  return new Date(date).toLocaleDateString(
    "tr-TR",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );

}

function escapeHTML(str) {

  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function escapeAttr(str) {
  return escapeHTML(str);
}
