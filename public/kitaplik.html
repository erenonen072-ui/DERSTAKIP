<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DersTakip | Ders Kitaplığı</title>

    <meta
        name="description"
        content="DersTakip konu anlatım kitaplığı - 5. sınıftan 12. sınıfa ders ve konu anlatımları."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f6f8fc;
            color: #172033;
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .kt-app {
            min-height: 100vh;
        }

        /* HEADER */

        .kt-header {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 72px;

            background: rgba(255,255,255,.92);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid #e8ebf2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .kt-brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-weight: 800;
            font-size: 19px;

            color: #171d2d;
        }

        .kt-logo {
            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #635bff,
                #3478f6
            );

            color: white;
            font-size: 21px;

            box-shadow: 0 8px 20px rgba(99,91,255,.22);
        }

        .kt-back {
            border: 1px solid #e3e7ef;
            background: white;

            padding: 10px 15px;
            border-radius: 11px;

            color: #4d5870;
            font-weight: 700;

            transition: .2s;
        }

        .kt-back:hover {
            transform: translateY(-1px);
            border-color: #cbd1df;
        }

        /* MAIN */

        .kt-container {
            max-width: 1250px;
            margin: auto;

            padding: 42px 24px 80px;
        }

        .kt-hero {
            background:
                radial-gradient(
                    circle at top right,
                    rgba(99,91,255,.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f7f7ff
                );

            border: 1px solid #e7e8f5;
            border-radius: 26px;

            padding: 38px;

            margin-bottom: 28px;

            box-shadow: 0 15px 45px rgba(20,30,60,.05);
        }

        .kt-hero-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            background: #eeecff;
            color: #5a51e8;

            padding: 7px 12px;

            border-radius: 999px;

            font-size: 13px;
            font-weight: 800;

            margin-bottom: 15px;
        }

        .kt-hero h1 {
            font-size: clamp(30px, 5vw, 46px);
            letter-spacing: -1.5px;

            margin-bottom: 12px;
        }

        .kt-hero p {
            max-width: 720px;

            color: #657087;
            font-size: 16px;
            line-height: 1.7;
        }

        /* SEARCH */

        .kt-search {
            position: relative;
            margin-bottom: 30px;
        }

        .kt-search input {
            width: 100%;

            height: 55px;

            border: 1px solid #e1e5ee;
            border-radius: 15px;

            background: white;

            padding: 0 18px 0 48px;

            outline: none;

            transition: .2s;

            box-shadow: 0 6px 25px rgba(20,30,60,.04);
        }

        .kt-search input:focus {
            border-color: #8179ff;
            box-shadow: 0 0 0 4px rgba(99,91,255,.09);
        }

        .kt-search-icon {
            position: absolute;
            left: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: #7a8498;
        }

        /* SECTION */

        .kt-section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 17px;
        }

        .kt-section-title h2 {
            font-size: 22px;
        }

        .kt-section-title span {
            color: #7b8497;
            font-size: 14px;
        }

        /* GRADE */

        .kt-grade-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0,1fr));

            gap: 15px;

            margin-bottom: 35px;
        }

        .kt-grade {
            position: relative;

            background: white;

            border: 1px solid #e5e8ef;

            border-radius: 18px;

            padding: 21px;

            min-height: 115px;

            text-align: left;

            transition:
                transform .2s,
                box-shadow .2s,
                border-color .2s;
        }

        .kt-grade:hover {
            transform: translateY(-4px);

            border-color: #bfc0ff;

            box-shadow:
                0 15px 35px rgba(40,40,100,.09);
        }

        .kt-grade.active {
            border-color: #635bff;

            box-shadow:
                0 0 0 3px rgba(99,91,255,.1);
        }

        .kt-grade-icon {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .kt-grade strong {
            display: block;
            font-size: 16px;
        }

        .kt-grade small {
            display: block;

            color: #8a92a4;

            margin-top: 4px;
        }

        /* BOOKS */

        .kt-book-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 17px;
        }

        .kt-book {
            background: white;

            border: 1px solid #e5e8ef;

            border-radius: 20px;

            padding: 23px;

            transition: .2s;

            cursor: pointer;
        }

        .kt-book:hover {
            transform: translateY(-4px);

            box-shadow:
                0 16px 35px rgba(20,30,60,.08);

            border-color: #d0d3ff;
        }

        .kt-book-icon {
            width: 52px;
            height: 52px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f0efff;

            font-size: 25px;

            margin-bottom: 17px;
        }

        .kt-book h3 {
            margin-bottom: 7px;
        }

        .kt-book p {
            color: #788195;
            font-size: 14px;
            line-height: 1.5;
        }

        .kt-book-footer {
            margin-top: 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .kt-book-count {
            font-size: 13px;
            color: #858da0;
        }

        .kt-open {
            color: #635bff;
            font-weight: 800;
            font-size: 13px;
        }

        /* TOP BAR */

        .kt-breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 8px;

            color: #778096;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .kt-breadcrumb button {
            border: 0;
            background: none;
            color: #635bff;
            font-weight: 700;
        }

        /* TOPIC */

        .kt-topic-layout {
            display: grid;

            grid-template-columns: 300px 1fr;

            gap: 25px;

            align-items: start;
        }

        .kt-topic-sidebar {
            background: white;

            border: 1px solid #e5e8ef;

            border-radius: 20px;

            padding: 17px;

            position: sticky;
            top: 95px;
        }

        .kt-topic-sidebar h3 {
            padding: 7px 8px 15px;

            font-size: 15px;
        }

        .kt-topic-list {
            display: flex;
            flex-direction: column;

            gap: 5px;
        }

        .kt-topic-btn {
            border: 0;
            background: transparent;

            text-align: left;

            padding: 12px;

            border-radius: 11px;

            color: #596276;

            transition: .15s;
        }

        .kt-topic-btn:hover {
            background: #f5f5ff;
            color: #554de0;
        }

        .kt-topic-btn.active {
            background: #eeecff;
            color: #5148dc;
            font-weight: 800;
        }

        .kt-topic-btn.completed::after {
            content: " ✓";

            color: #20a36a;
            font-weight: 900;
        }

        /* CONTENT */

        .kt-reader {
            background: white;

            border: 1px solid #e5e8ef;

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 12px 40px rgba(20,30,60,.045);
        }

        .kt-reader-header {
            padding: 35px;

            background:
                linear-gradient(
                    135deg,
                    #f6f5ff,
                    #ffffff
                );

            border-bottom: 1px solid #ebedf3;
        }

        .kt-reader-label {
            display: inline-block;

            background: #eae8ff;

            color: #574de0;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 12px;
            font-weight: 800;

            margin-bottom: 12px;
        }

        .kt-reader-header h1 {
            font-size: clamp(27px, 4vw, 38px);

            letter-spacing: -.8px;

            margin-bottom: 10px;
        }

        .kt-reader-header p {
            color: #747d90;
            line-height: 1.6;
        }

        .kt-reader-body {
            padding: 35px;
        }

        .kt-content-section {
            margin-bottom: 32px;
        }

        .kt-content-section h2 {
            font-size: 21px;
            margin-bottom: 12px;
        }

        .kt-content-section p {
            color: #525d72;
            line-height: 1.85;
            font-size: 16px;
        }

        .kt-info-box {
            padding: 20px;

            border-radius: 15px;

            margin: 18px 0;
        }

        .kt-info-box h3 {
            margin-bottom: 8px;
            font-size: 16px;
        }

        .kt-info-box p {
            font-size: 15px;
        }

        .kt-info {
            background: #f1f7ff;
            border: 1px solid #dcecff;
        }

        .kt-example {
            background: #f5f2ff;
            border: 1px solid #e5e1ff;
        }

        .kt-warning {
            background: #fff8e9;
            border: 1px solid #f6e6bc;
        }

        .kt-summary {
            background: #effaf5;
            border: 1px solid #d5f0e3;
        }

        /* TEST */

        .kt-test {
            margin-top: 20px;
        }

        .kt-question {
            border: 1px solid #e5e8ef;

            border-radius: 15px;

            padding: 18px;

            margin-bottom: 13px;
        }

        .kt-question p {
            margin-bottom: 13px;
            color: #30394d;
            font-weight: 700;
        }

        .kt-options {
            display: grid;
            gap: 8px;
        }

        .kt-option {
            border: 1px solid #e1e5ec;

            background: #fafbfc;

            padding: 11px 13px;

            border-radius: 10px;

            text-align: left;

            color: #555f72;

            transition: .15s;
        }

        .kt-option:hover {
            border-color: #b8b3ff;
            background: #f7f6ff;
        }

        .kt-option.correct {
            border-color: #39ae78;
            background: #edfaf3;
            color: #168053;
        }

        .kt-option.wrong {
            border-color: #e46b6b;
            background: #fff0f0;
            color: #c44747;
        }

        /* ACTIONS */

        .kt-reader-actions {
            padding: 20px 35px;

            border-top: 1px solid #ebedf3;

            display: flex;

            justify-content: space-between;
            gap: 10px;
        }

        .kt-action {
            border: 1px solid #e1e4eb;

            background: white;

            border-radius: 11px;

            padding: 11px 15px;

            color: #4d576b;

            font-weight: 700;
        }

        .kt-action.primary {
            background: #635bff;
            color: white;
            border-color: #635bff;
        }

        .kt-action.primary.completed {
            background: #20a36a;
            border-color: #20a36a;
        }

        .kt-action:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* PROGRESS */

        .kt-progress {
            margin-top: 15px;
        }

        .kt-progress-top {
            display: flex;
            justify-content: space-between;

            font-size: 13px;
            color: #788195;

            margin-bottom: 7px;
        }

        .kt-progress-bar {
            height: 8px;

            background: #eceef4;

            border-radius: 99px;

            overflow: hidden;
        }

        .kt-progress-fill {
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #635bff,
                    #3984ff
                );

            border-radius: inherit;

            transition: width .4s;
        }

        /* EMPTY */

        .kt-empty {
            text-align: center;

            padding: 60px 20px;

            color: #7c8598;
        }

        .kt-empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        /* RESPONSIVE */

        @media(max-width: 900px) {

            .kt-grade-grid {
                grid-template-columns:
                    repeat(2, minmax(0,1fr));
            }

            .kt-book-grid {
                grid-template-columns:
                    repeat(2, minmax(0,1fr));
            }

            .kt-topic-layout {
                grid-template-columns: 1fr;
            }

            .kt-topic-sidebar {
                position: static;
            }

        }

        @media(max-width: 600px) {

            .kt-header {
                padding: 0 15px;
            }

            .kt-brand span {
                display: none;
            }

            .kt-container {
                padding:
                    22px 14px 60px;
            }

            .kt-hero {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .kt-grade-grid,
            .kt-book-grid {
                grid-template-columns: 1fr;
            }

            .kt-reader-header,
            .kt-reader-body {
                padding: 24px 19px;
            }

            .kt-reader-actions {
                padding: 17px 19px;

                flex-direction: column;
            }

            .kt-action {
                width: 100%;
            }

        }
    </style>
</head>

<body>

<div class="kt-app">

    <header class="kt-header">

        <div class="kt-brand">

            <div class="kt-logo">
                📚
            </div>

            <span>
                DersTakip Kitaplığı
            </span>

        </div>

        <button
            class="kt-back"
            onclick="goHome()"
        >
            ← DersTakip
        </button>

    </header>

    <main class="kt-container">

        <section class="kt-hero">

            <div class="kt-hero-label">
                📚 KONU ANLATIM KİTAPLIĞI
            </div>

            <h1>
                Derslerini kitaptan öğren.
            </h1>

            <p>
                5. sınıftan 12. sınıfa kadar derslerini,
                konularını ve konu anlatımlarını tek yerde
                keşfet. Konuyu oku, örnekleri incele,
                mini testi çöz ve ilerlemeni kaydet.
            </p>

        </section>

        <div class="kt-search">

            <span class="kt-search-icon">
                🔍
            </span>

            <input
                id="ktSearch"
                type="search"
                placeholder="Konu veya ders ara..."
                oninput="searchLibrary()"
            >

        </div>

        <div id="ktApp"></div>

    </main>

</div>


<script src="kitaplik.js"></script>

</body>
</html>
